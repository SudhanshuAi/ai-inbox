services:
  # ── 1. Backend Express API Web Service (Free Tier) ─────────────────────────
  - type: web
    name: ai-knowledge-inbox-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /data/knowledge.db
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  # ── 2. Frontend React / Vite Static Site (Free Tier) ────────────────────────
  - type: web
    name: ai-knowledge-inbox-web
    env: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-knowledge-inbox-api
          property: url
