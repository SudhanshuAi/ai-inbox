services:
  # ── 1. Backend Express API Web Service (Free Tier) ─────────────────────────
  - type: web
    name: ai-knowledge-inbox-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: ./data/knowledge.db
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"

  # ── 2. Frontend React / Vite Static Site (Free Tier) ────────────────────────
  # NOTE: VITE_API_URL must be the full https:// URL of the API service.
  # Render's fromService.property:host only returns a bare hostname (no protocol),
  # but Vite bakes this value at BUILD time, so we set it explicitly here.
  - type: web
    name: ai-knowledge-inbox-web
    env: static
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-knowledge-inbox-api.onrender.com
