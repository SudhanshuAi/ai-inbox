services:
  - type: web
    name: ai-knowledge-inbox-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: ai-knowledge-inbox-web
          property: host
      - key: SQLITE_PATH
        value: /data/knowledge.db
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: LOG_LEVEL
        value: info
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
